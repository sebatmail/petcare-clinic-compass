server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Archivos Estáticos Servidos Directamente por Nginx
    location /static/ {
        alias /home/ubuntu/petcare_project/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Archivos Multimedia (Imágenes y Fichas PDF)
    location /media/ {
        alias /home/ubuntu/petcare_project/media/;
        expires 30d;
    }

    # Proxy hacia el Socket Unix de Gunicorn
    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/petcare_project/petcare.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logs de Acceso y Errores
    error_log /var/log/nginx/petcare_error.log;
    access_log /var/log/nginx/petcare_access.log;
}
